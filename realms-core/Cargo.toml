[package]
name = "realms-core"
version = "0.1.0"
edition = "2021"
description = "Realms RP 平台胶水层 — DM 编排器 + reducer + cycle 管理"
license = "MIT"
authors = ["Realms Team"]

[lib]
name = "realms_core"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# SQLite (bundled = 静态链接 libsqlite3-sys, 含 FTS5 + JSON1 等内置扩展)
rusqlite = { version = "0.32", features = ["bundled"] }

# Connection pool
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# HTTP client (for HttpLlmProvider)
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
